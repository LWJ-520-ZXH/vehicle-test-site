<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="100%" role="img"><title>ECU 刷写三阶段可视化流程图</title><desc>预编程阶段确认版本并准备环境，主编程阶段解锁-检查-擦除-下载-校验，后编程阶段复位-恢复-清 DTC-确认版本；含 $3E 保持会话与 $2E 写入指纹等关键提醒。</desc><style>
.t { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2937; }
.ts { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #1f2937; }
.th { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; font-weight: 600; fill: #ffffff; }
.lbl { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: rgba(255,255,255,.9); }
.box { stroke: #374151; stroke-width: 1; }
.stage-head { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
.note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2937; }
.warn { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #92400e; }
</style>

<!-- 背景画布 -->
<rect x="0" y="0" width="720" height="600" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

<!-- 标题 -->
<text class="th" x="40" y="32">ECU 刷写三阶段可视化流程</text>
<text class="ts" x="40" y="54">UDS 服务只是工具，具体顺序、是否加 $3E/$2E 由 OEM 刷写规范决定。</text>

<!-- 箭头定义 -->
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8" fill="#64748b"/>
  </marker>
</defs>

<!-- ========== 阶段一：预编程 ========== -->
<g transform="translate(40, 78)">
  <rect x="0" y="0" width="200" height="34" rx="6" fill="#3b82f6"/>
  <text class="stage-head" x="100" y="23" text-anchor="middle">阶段一 · 预编程</text>

  <rect class="box" x="10" y="44" width="180" height="44" rx="5" fill="#eff6ff"/>
  <text class="mono" x="100" y="65" text-anchor="middle" fill="#1e40af">$10 03</text>
  <text class="ts" x="100" y="80" text-anchor="middle">扩展会话</text>

  <line x1="100" y1="88" x2="100" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="108" width="180" height="44" rx="5" fill="#eff6ff"/>
  <text class="mono" x="100" y="129" text-anchor="middle" fill="#1e40af">$22 F188 / F189</text>
  <text class="ts" x="100" y="144" text-anchor="middle">读版本号 / 零件号</text>

  <line x1="100" y1="152" x2="100" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="172" width="180" height="44" rx="5" fill="#eff6ff"/>
  <text class="mono" x="100" y="193" text-anchor="middle" fill="#1e40af">$85 02 → $28 03</text>
  <text class="ts" x="100" y="208" text-anchor="middle">关 DTC 记录 / 关通信</text>
</g>

<!-- 阶段间箭头 -->
<path d="M 240 220 L 270 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text class="ts" x="255" y="212" text-anchor="middle">进入</text>
<text class="ts" x="255" y="235" text-anchor="middle">编程</text>

<!-- ========== 阶段二：主编程 ========== -->
<g transform="translate(280, 78)">
  <rect x="0" y="0" width="200" height="34" rx="6" fill="#8b5cf6"/>
  <text class="stage-head" x="100" y="23" text-anchor="middle">阶段二 · 主编程</text>

  <rect class="box" x="10" y="44" width="180" height="34" rx="5" fill="#f5f3ff"/>
  <text class="mono" x="100" y="60" text-anchor="middle" fill="#5b21b6">$10 02</text>
  <text class="ts" x="100" y="72" text-anchor="middle">编程会话</text>

  <line x1="100" y1="78" x2="100" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="94" width="180" height="34" rx="5" fill="#f5f3ff"/>
  <text class="mono" x="100" y="110" text-anchor="middle" fill="#5b21b6">$27 01 / 02</text>
  <text class="ts" x="100" y="122" text-anchor="middle">安全解锁</text>

  <line x1="100" y1="128" x2="100" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="144" width="180" height="34" rx="5" fill="#f5f3ff"/>
  <text class="mono" x="100" y="160" text-anchor="middle" fill="#5b21b6">$31 FF01</text>
  <text class="ts" x="100" y="172" text-anchor="middle">检查前提条件</text>

  <line x1="100" y1="178" x2="100" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="194" width="180" height="34" rx="5" fill="#f5f3ff"/>
  <text class="mono" x="100" y="210" text-anchor="middle" fill="#5b21b6">$31 FF00</text>
  <text class="ts" x="100" y="222" text-anchor="middle">擦除内存</text>

  <line x1="100" y1="228" x2="100" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="244" width="180" height="50" rx="5" fill="#f5f3ff"/>
  <text class="mono" x="100" y="265" text-anchor="middle" fill="#5b21b6">$34 → $36 → $37</text>
  <text class="ts" x="100" y="283" text-anchor="middle">请求下载 → 传输 → 退出</text>

  <line x1="100" y1="294" x2="100" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="310" width="180" height="34" rx="5" fill="#f5f3ff"/>
  <text class="mono" x="100" y="326" text-anchor="middle" fill="#5b21b6">$31 FF02</text>
  <text class="ts" x="100" y="338" text-anchor="middle">CRC 完整性校验</text>

  <!-- 循环标注 -->
  <path d="M 195 269 C 215 269, 215 220, 195 220" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text class="ts" x="222" y="250" fill="#7c3aed">每块数据循环</text>
</g>

<!-- 阶段间箭头 -->
<path d="M 480 220 L 510 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text class="ts" x="495" y="212" text-anchor="middle">退出</text>
<text class="ts" x="495" y="235" text-anchor="middle">编程</text>

<!-- ========== 阶段三：后编程 ========== -->
<g transform="translate(520, 78)">
  <rect x="0" y="0" width="160" height="34" rx="6" fill="#10b981"/>
  <text class="stage-head" x="80" y="23" text-anchor="middle">阶段三 · 后编程</text>

  <rect class="box" x="10" y="44" width="140" height="44" rx="5" fill="#ecfdf5"/>
  <text class="mono" x="80" y="65" text-anchor="middle" fill="#065f46">$11 01</text>
  <text class="ts" x="80" y="80" text-anchor="middle">硬复位</text>

  <line x1="80" y1="88" x2="80" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="108" width="140" height="44" rx="5" fill="#ecfdf5"/>
  <text class="mono" x="80" y="129" text-anchor="middle" fill="#065f46">$28 00 / $85 01</text>
  <text class="ts" x="80" y="144" text-anchor="middle">恢复通信 / DTC</text>

  <line x1="80" y1="152" x2="80" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="172" width="140" height="44" rx="5" fill="#ecfdf5"/>
  <text class="mono" x="80" y="193" text-anchor="middle" fill="#065f46">$14 FF FF FF</text>
  <text class="ts" x="80" y="208" text-anchor="middle">清除 DTC</text>

  <line x1="80" y1="216" x2="80" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="236" width="140" height="44" rx="5" fill="#ecfdf5"/>
  <text class="mono" x="80" y="257" text-anchor="middle" fill="#065f46">$22 F188</text>
  <text class="ts" x="80" y="272" text-anchor="middle">确认版本</text>
</g>

<!-- ========== 关键提醒（底部卡片） ========== -->
<g transform="translate(40, 370)">
  <text class="th" x="0" y="0">流程图里没写但必须知道</text>

  <rect class="box" x="0" y="12" width="330" height="68" rx="6" fill="#f1f5f9"/>
  <rect x="0" y="12" width="6" height="68" rx="3" fill="#f59e0b"/>
  <text class="note" x="18" y="34" font-weight="700">$3E TesterPresent · 保持会话</text>
  <text class="ts" x="18" y="54">阶段二耗时长，需在 S3server 超时前周期性发送 $3E，</text>
  <text class="ts" x="18" y="72">否则 ECU 退出编程会话导致刷写中断。</text>

  <rect class="box" x="350" y="12" width="330" height="68" rx="6" fill="#f1f5f9"/>
  <rect x="350" y="12" width="6" height="68" rx="3" fill="#06b6d4"/>
  <text class="note" x="368" y="34" font-weight="700">$2E WriteDataByIdentifier · 写入指纹</text>
  <text class="ts" x="368" y="54">部分 OEM 在后编程阶段要求写入诊断仪 ID、工号、</text>
  <text class="ts" x="368" y="72">时间戳等到指定 DID（如 F199），用于版本追溯。</text>

  <rect class="box" x="0" y="92" width="330" height="52" rx="6" fill="#f1f5f9"/>
  <rect x="0" y="92" width="6" height="52" rx="3" fill="#8b5cf6"/>
  <text class="note" x="18" y="114" font-weight="700">$28 与 $85 顺序可互换</text>
  <text class="ts" x="18" y="134">先关通信还是先关 DTC 记录，不同车厂约定不同。</text>

  <rect class="box" x="350" y="92" width="330" height="52" rx="6" fill="#f1f5f9"/>
  <rect x="350" y="92" width="6" height="52" rx="3" fill="#ef4444"/>
  <text class="note" x="368" y="114" font-weight="700">$31 routineIdentifier 为 OEM 自定义</text>
  <text class="ts" x="368" y="134">FF01/FF00/FF02 只是常见约定，具体含义以项目规范为准。</text>
</g>

<!-- 底部结论 -->
<rect x="40" y="542" width="640" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text class="warn" x="360" y="568" text-anchor="middle" font-size="13">刷写流程没有唯一标准答案，测试前务必拿到当前项目的 OEM 刷写规范。</text>

</svg>