<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" role="img"><title>ECU 刷写：流程图里没写但必须知道的事</title><desc>UDS 只定义诊断服务，刷写具体流程由 OEM 规范决定；示意图突出 $3E 保持会话、$2E 写入指纹、$28/$85 顺序可互换、$31 routineIdentifier 为 OEM 自定义四个关键点。</desc><style>
.t { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #1f2937; }
.ts { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2937; }
.th { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; font-weight: 600; fill: #111827; }
.box { stroke: #374151; stroke-width: 1; }
.lbl { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #1f2937; }
.note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2937; }
.stage-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
.stage-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #ffffff; opacity: .92; }
.card-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #1f2937; }
</style>

<!-- 背景画布：独立浅色卡片，确保在暗色站点主题下仍可读 -->
<rect x="0" y="0" width="720" height="460" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

<!-- 标题区 -->
<text class="th" x="40" y="32">工程师视角：流程图里没写但必须知道的事</text>
<text class="ts" x="40" y="54">UDS 只定义 $10/$27/$31/$34/$36/$37 等服务，刷写具体顺序由 OEM 规范决定。</text>

<!-- 三阶段流程条 -->
<g transform="translate(40, 78)">
  <!-- 预编程 -->
  <rect class="box" x="0" y="0" width="190" height="68" rx="6" fill="#3b82f6"/>
  <text class="stage-title" x="95" y="26" text-anchor="middle">阶段一 · 预编程</text>
  <text class="stage-sub" x="95" y="44" text-anchor="middle">$10 03 → $22 读版本号</text>
  <text class="stage-sub" x="95" y="60" text-anchor="middle">$85 / $28 准备环境</text>

  <!-- 箭头 -->
  <path d="M 195 34 L 220 34 L 215 28 M 220 34 L 215 40" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 主编程 -->
  <rect class="box" x="225" y="0" width="190" height="68" rx="6" fill="#8b5cf6"/>
  <text class="stage-title" x="320" y="26" text-anchor="middle">阶段二 · 主编程</text>
  <text class="stage-sub" x="320" y="44" text-anchor="middle">$10 02 → $27 解锁</text>
  <text class="stage-sub" x="320" y="60" text-anchor="middle">$31 → $34/$36/$37</text>

  <!-- 箭头 -->
  <path d="M 420 34 L 445 34 L 440 28 M 445 34 L 440 40" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 后编程 -->
  <rect class="box" x="450" y="0" width="190" height="68" rx="6" fill="#10b981"/>
  <text class="stage-title" x="545" y="26" text-anchor="middle">阶段三 · 后编程</text>
  <text class="stage-sub" x="545" y="44" text-anchor="middle">$11 复位 → $28/$85 恢复</text>
  <text class="stage-sub" x="545" y="60" text-anchor="middle">$14 清 DTC / $22 确认版本</text>
</g>

<!-- 分隔说明 -->
<text class="note" x="40" y="172">大框架是共识，但每个阶段里的服务顺序、是否加 $3E/$2E，取决于车厂规范。</text>

<!-- 四个注意卡片（2x2） -->
<g transform="translate(40, 190)">
  <!-- 卡片 1：$3E -->
  <rect class="box" x="0" y="0" width="310" height="92" rx="6" fill="#f1f5f9"/>
  <rect x="0" y="0" width="6" height="92" rx="3" fill="#f59e0b"/>
  <text class="card-title" x="18" y="22">$3E TesterPresent · 保持会话</text>
  <text class="ts" x="18" y="44">阶段二耗时长，必须在 S3server 超时前</text>
  <text class="ts" x="18" y="62">周期性发送 $3E 80（或 $3E 00），否则</text>
  <text class="ts" x="18" y="80">ECU 退出编程会话导致刷写中断。</text>

  <!-- 卡片 2：$2E -->
  <rect class="box" x="330" y="0" width="310" height="92" rx="6" fill="#f1f5f9"/>
  <rect x="330" y="0" width="6" height="92" rx="3" fill="#06b6d4"/>
  <text class="card-title" x="348" y="22">$2E WriteDataByIdentifier · 写入指纹</text>
  <text class="ts" x="348" y="44">部分 OEM 在后编程阶段要求写入</text>
  <text class="ts" x="348" y="62">诊断仪 ID、操作员工号、时间戳等</text>
  <text class="ts" x="348" y="80">到指定 DID（如 F199），用于版本追溯。</text>

  <!-- 卡片 3：$28/$85 -->
  <rect class="box" x="0" y="112" width="310" height="76" rx="6" fill="#f1f5f9"/>
  <rect x="0" y="112" width="6" height="76" rx="3" fill="#8b5cf6"/>
  <text class="card-title" x="18" y="134">$28 与 $85 顺序可互换</text>
  <text class="ts" x="18" y="156">先关非诊断通信还是先关 DTC 记录，</text>
  <text class="ts" x="18" y="174">不同车厂约定不同，不影响最终效果。</text>

  <!-- 卡片 4：$31 routineIdentifier -->
  <rect class="box" x="330" y="112" width="310" height="76" rx="6" fill="#f1f5f9"/>
  <rect x="330" y="112" width="6" height="76" rx="3" fill="#ef4444"/>
  <text class="card-title" x="348" y="134">$31 routineIdentifier 是 OEM 自定义</text>
  <text class="ts" x="348" y="156">FF01/FF00/FF02 只是常见约定，</text>
  <text class="ts" x="348" y="174">具体含义必须以项目规范为准。</text>
</g>

<!-- 底部结论 -->
<rect x="40" y="396" width="640" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text class="ts" x="360" y="416" text-anchor="middle" font-weight="600" fill="#92400e">刷写流程没有唯一标准答案，测试前务必先拿到当前项目的 OEM 刷写规范。</text>

</svg>