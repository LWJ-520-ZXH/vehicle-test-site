<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="560" height="380" rx="14" fill="#f8fafc"/>
  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">DB9（DE-9）9 针 — CAN 常用脚位</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#475569">代表定义 CiA 303-1；不同厂商脚位略有差异，以设备手册为准</text>

  <!-- connector body -->
  <rect x="150" y="92" width="260" height="150" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="162" y="104" width="236" height="126" rx="8" fill="#cbd5e1"/>

  <!-- top row pins 1-5 (y=140) -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="190" cy="140" r="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="190" y="144" fill="#334155">1</text>
    <circle cx="235" cy="140" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="235" y="144" fill="#1e3a8a">2</text>
    <circle cx="280" cy="140" r="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="280" y="144" fill="#334155">3</text>
    <circle cx="325" cy="140" r="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="325" y="144" fill="#334155">4</text>
    <circle cx="370" cy="140" r="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="370" y="144" fill="#334155">5</text>
    <!-- bottom row pins 6-9 (y=196) -->
    <circle cx="212.5" cy="196" r="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="212.5" y="200" fill="#334155">6</text>
    <circle cx="257.5" cy="196" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="257.5" y="200" fill="#14532d">7</text>
    <circle cx="302.5" cy="196" r="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="302.5" y="200" fill="#334155">8</text>
    <circle cx="347.5" cy="196" r="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="347.5" y="200" fill="#334155">9</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#334155">
    <text x="150" y="278" font-weight="700" fill="#0f172a">脚位定义（左 1–5 / 右 6–9）</text>
    <text x="150" y="302">1 — 未用 / 保留</text>
    <text x="150" y="322">2 — <tspan fill="#2563eb" font-weight="700">CAN_L</tspan></text>
    <text x="150" y="342">3 — <tspan fill="#64748b" font-weight="700">CAN_GND</tspan>（屏蔽地）</text>
    <text x="150" y="362">4 — 未用 / 保留</text>

    <text x="350" y="302">5 — <tspan fill="#64748b" font-weight="700">CAN_GND</tspan>（信号地）</text>
    <text x="350" y="322">6 — 未用 / 保留</text>
    <text x="350" y="342">7 — <tspan fill="#16a34a" font-weight="700">CAN_H</tspan></text>
    <text x="350" y="362">8 — 未用 / 保留　9 — CAN_V+（可选）</text>
  </g>
</svg>
