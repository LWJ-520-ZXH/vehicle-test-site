34" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">Start-up</text><rect x="380" y="210" width="108" height="28" rx="6" ry="6" fill="#dbe7ef" stroke="#94a3b8" stroke-width="1" /><text x="434" y="229" font-size="11" fill="#334" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">Switching</text><rect x="500" y="210" width="108" height="28" rx="6" ry="6" fill="#dbe7ef" stroke="#94a3b8" stroke-width="1" /><text x="554" y="229" font-size="11" fill="#334" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">RF</text><rect x="140" y="256" width="320" height="100" rx="8" ry="8" fill="#0b1220" stroke="#3a3306" stroke-width="2" /><polyline points="140,330 200,330 260,300 300,200 320,360 380,330 460,330" fill="none" stroke="#fde047" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="274" font-size="11" fill="#fde047" font-weight="600" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">Pulse 5a (Load Dump)  ~80 V / 100 ms</text><circle cx="520" cy="270" r="7" fill="#1a7f37" stroke="none" stroke-width="1"/><circle cx="520" cy="300" r="7" fill="#f59e0b" stroke="none" stroke-width="1"/><circle cx="520" cy="330" r="7" fill="#ef4444" stroke="none" stroke-width="1"/><text x="536" y="274" font-size="11" fill="#334" font-weight="500" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">运行</text><text x="536" y="304" font-size="11" fill="#334" font-weight="500" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">告警</text><text x="536" y="334" font-size="11" fill="#334" font-weight="500" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">故障</text><text x="360.0" y="444" text-anchor="middle" font-size="12" fill="#64748b">电源瞬态干扰模拟器：按 ISO 7637-2 / ISO 16750-2 注入抛负载、跳起、切换等脉冲，验证电气抗扰</text></svg>