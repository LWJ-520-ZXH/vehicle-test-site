<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" role="img"><rect width="720" height="460" fill="#f8fafc"/><text x="360.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">电源瞬态干扰模拟器（ISO 7637 / 电气环境）</text><text x="360.0" y="56" text-anchor="middle" font-size="12.5" fill="#475569">模拟供电线上的瞬态骚扰，验证 ECU 在抛负载/跳起/切换等异常下的抗扰能力</text><rect x="110" y="86" width="500" height="300" rx="14" ry="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2" /><rect x="140" y="116" width="56" height="46" rx="6" ry="6" fill="#1f2937" stroke="#0b0f14" stroke-width="2" /><circle cx="152" cy="130" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="168" cy="130" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="184" cy="130" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="152" cy="148" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="168" cy="148" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="184" cy="148" r="4" fill="#475569" stroke="none" stroke-width="1"/><text x="168" y="178" font-size="10" fill="#334" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">H1</text><rect x="210" y="116" width="56" height="46" rx="6" ry="6" fill="#1f2937" stroke="#0b0f14" stroke-width="2" /><circle cx="222" cy="130" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="238" cy="130" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="254" cy="130" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="222" cy="148" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="238" cy="148" r="4" fill="#475569" stroke="none" stroke-width="1"/><circle cx="254" cy="148" r="4" fill="#475569" stroke="none" stroke-width="1"/><text x="238" y="178" font-size="10" fill="#334" font-weight="600" text-anchor="middle" font-family="-apple-system