<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" role="img"><rect width="720" height="460" fill="#f8fafc"/><text x="360.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">热成像仪与电流探头（无损诊断双雄）</text><text x="360.0" y="56" text-anchor="middle" font-size="12.5" fill="#475569">非接触测温定位过热，钳形电流探头查漏电流，均无需断开线路</text><rect x="120" y="110" width="150" height="200" rx="16" ry="16" fill="#1f2937" stroke="#0b0f14" stroke-width="2" /><rect x="132" y="200" width="126" height="96" rx="8" ry="8" fill="#0b1220" stroke="#3a0d0d" stroke-width="2" /><defs><radialGradient id="heat" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ef4444"/><stop offset="45%" stop-color="#f59e0b"/><stop offset="75%" stop-color="#22c55e"/><stop offset="100%" stop-color="#1e3a8a"/></radialGradient></defs><circle cx="195" cy="248" r="34" fill="url(#heat)" stroke="none" stroke-width="1"/><text x="195" y="338" font-size="16" fill="#fecaca" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">87.3 °C</text><rect x="180" y="310" width="30" height="60" rx="8" ry="8" fill="#111827" stroke="#374151" stroke-width="2" /><text x="195" y="400" font-size="12" fill="#334" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">热成像仪</text><line x1="470" y1="130" x2="470" y2="320" stroke="#475569" stroke-width="6"/><path d="M 540 180 A 46 46 0 1 1 540 272" fill="none" stroke="#1f2937" stroke-width="20" stroke-linecap="round"/><path d="M 540 180 A 46 46 0 1 1 540 272" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/><circle cx="540" cy="180" r="8" fill="#1f2937" stroke="none" stroke-width="1"/><circle cx="540" cy="272" r="8" fill="#1f2937" stroke="none" stroke-width="1"/><text x="540" y="320" font-size="12" fill="#334" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">电流探头</text><rect x="500" y="340" width="110" height="36" rx="8" ry="8" fill="#0b1220" stroke="#3a0d0d" stroke-width="2" /><text x="555" y="363" font-size="13" fill="#fca5a5" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">I = 12.8 A</text><text x="195" y="430" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">非接触测温 -20~550°C · 找过热/漏电</text><text x="540" y="430" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">AC/DC 0–600 A · 无需断线</text><text x="360.0" y="444" text-anchor="middle" font-size="12" fill="#64748b">热成像仪 + 电流探头：无损诊断双雄，一个找过热，一个查漏电流，都不用拆线</text></svg>