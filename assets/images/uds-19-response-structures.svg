<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="100%" role="img"><title>UDS $19 子服务响应结构与字节拆分</title><desc>按字节展示 $19 01/02 请求、$19 02 响应，以及 19 02 09 / 59 02 09 C1 40 41 09 的拆分，并汇总 7 个子服务的 4 类响应结构</desc><style>
.t { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #1f2937; }
.ts { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2937; }
.th { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; fill: #111827; }
.box { stroke: #374151; stroke-width: 1; }
.lbl { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #1f2937; }
.note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2937; }
</style>

<!-- 背景画布：独立浅色卡片，确保在暗色站点主题下仍可读 -->
<rect x="0" y="0" width="720" height="760" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

<!-- 1. $19 01 / 02 请求 -->
<text class="th" x="40" y="32">$19 01 / $19 02 请求字节结构</text>
<g transform="translate(40, 50)">
  <rect class="box" x="0" y="0" width="130" height="52" rx="4" fill="#60a5fa"/>
  <text class="mono" x="65" y="24" text-anchor="middle">19</text>
  <text class="lbl" x="65" y="42" text-anchor="middle">Service ID</text>

  <rect class="box" x="130" y="0" width="130" height="52" rx="4" fill="#4ade80"/>
  <text class="mono" x="195" y="24" text-anchor="middle">01 / 02</text>
  <text class="lbl" x="195" y="42" text-anchor="middle">Sub-Function</text>

  <rect class="box" x="260" y="0" width="130" height="52" rx="4" fill="#fb923c"/>
  <text class="mono" x="325" y="24" text-anchor="middle">XX</text>
  <text class="lbl" x="325" y="42" text-anchor="middle">DTCStatusMask</text>
</g>

<!-- 2. $19 02 响应 -->
<text class="th" x="40" y="142">$19 02 响应字节结构</text>
<g transform="translate(40, 160)">
  <rect class="box" x="0" y="0" width="110" height="52" rx="4" fill="#60a5fa"/>
  <text class="mono" x="55" y="24" text-anchor="middle">59</text>
  <text class="lbl" x="55" y="42" text-anchor="middle">Response ID</text>

  <rect class="box" x="110" y="0" width="110" height="52" rx="4" fill="#4ade80"/>
  <text class="mono" x="165" y="24" text-anchor="middle">02</text>
  <text class="lbl" x="165" y="42" text-anchor="middle">Sub-Function</text>

  <rect class="box" x="220" y="0" width="110" height="52" rx="4" fill="#9ca3af"/>
  <text class="mono" x="275" y="24" text-anchor="middle">XX</text>
  <text class="lbl" x="275" y="42" text-anchor="middle">DTCStatusMask</text>

  <rect class="box" x="330" y="0" width="310" height="52" rx="4" fill="#fde047"/>
  <text class="mono" x="485" y="24" text-anchor="middle">[DTC(3B) + Status(1B)] × N</text>
  <text class="lbl" x="485" y="42" text-anchor="middle">DTCAndStatusRecord</text>
</g>

<!-- 3. 具体例子 -->
<text class="th" x="40" y="270">实战示例：请求 19 02 09，响应 59 02 09 C1 40 41 09</text>
<g transform="translate(40, 292)">
  <text class="ts" x="0" y="0">请求报文</text>
  <g transform="translate(0, 10)">
    <rect class="box" x="0" y="0" width="60" height="44" rx="4" fill="#60a5fa"/>
    <text class="mono" x="30" y="27" text-anchor="middle">19</text>
    <rect class="box" x="60" y="0" width="60" height="44" rx="4" fill="#4ade80"/>
    <text class="mono" x="90" y="27" text-anchor="middle">02</text>
    <rect class="box" x="120" y="0" width="60" height="44" rx="4" fill="#22d3ee"/>
    <text class="mono" x="150" y="27" text-anchor="middle">09</text>
  </g>
  <text class="note" x="195" y="42">← 状态掩码 0x09 = bit0 + bit3，读“当前失败且已确认”</text>

  <text class="ts" x="0" y="86">响应报文</text>
  <g transform="translate(0, 96)">
    <rect class="box" x="0" y="0" width="60" height="44" rx="4" fill="#60a5fa"/>
    <text class="mono" x="30" y="27" text-anchor="middle">59</text>
    <rect class="box" x="60" y="0" width="60" height="44" rx="4" fill="#4ade80"/>
    <text class="mono" x="90" y="27" text-anchor="middle">02</text>
    <rect class="box" x="120" y="0" width="60" height="44" rx="4" fill="#9ca3af"/>
    <text class="mono" x="150" y="27" text-anchor="middle">09</text>
    <rect class="box" x="180" y="0" width="60" height="44" rx="4" fill="#ef4444"/>
    <text class="mono" x="210" y="27" text-anchor="middle">C1</text>
    <rect class="box" x="240" y="0" width="60" height="44" rx="4" fill="#ef4444"/>
    <text class="mono" x="270" y="27" text-anchor="middle">40</text>
    <rect class="box" x="300" y="0" width="60" height="44" rx="4" fill="#ef4444"/>
    <text class="mono" x="330" y="27" text-anchor="middle">41</text>
    <rect class="box" x="360" y="0" width="60" height="44" rx="4" fill="#22d3ee"/>
    <text class="mono" x="390" y="27" text-anchor="middle">09</text>
  </g>

  <g transform="translate(0, 162)">
    <line x1="210" y1="0" x2="210" y2="22" stroke="#ef4444" stroke-width="1.5"/>
    <text class="ts" x="210" y="38" text-anchor="middle" fill="#7f1d1d" font-weight="600">DTC 故障码 3 字节：C1 40 41</text>

    <line x1="390" y1="0" x2="390" y2="22" stroke="#22d3ee" stroke-width="1.5"/>
    <text class="ts" x="390" y="38" text-anchor="middle" fill="#0e7490" font-weight="600">状态字节 1 字节：0x09</text>
  </g>
</g>

<!-- 4. 拆分四步法 -->
<text class="th" x="40" y="540">通用拆分 4 步法</text>
<g transform="translate(40, 562)">
  <rect class="box" x="0" y="0" width="640" height="34" rx="6" fill="#f3f4f6"/>
  <text class="t" x="12" y="22"><tspan font-weight="600">① 看首字节：</tspan>0x59 正响应，0x7F 负响应（第三字节为 NRC）</text>

  <rect class="box" x="0" y="42" width="640" height="52" rx="6" fill="#f3f4f6"/>
  <text class="t" x="12" y="62"><tspan font-weight="600">② 看子功能回声：</tspan>01=A 类计数；02/0A=B 类列表+AvailMask；0C=C 类列表；</text>
  <text class="t" x="12" y="80">03=D 类 RecordNum；04/06=E 类单 DTC+数据</text>

  <rect class="box" x="0" y="102" width="640" height="34" rx="6" fill="#f3f4f6"/>
  <text class="t" x="12" y="124"><tspan font-weight="600">③ 拆每条 DTC：</tspan>前 2B = 16bit 故障标识 → 5 字符码；第 3B = 状态字节 → bit 位图</text>

  <rect class="box" x="0" y="144" width="640" height="34" rx="6" fill="#f3f4f6"/>
  <text class="t" x="12" y="166"><tspan font-weight="600">④ 算条数：</tspan>条数 = (响应总长 − 头长) ÷ 单条长度；$19 02 头 3B、单条 4B</text>
</g>
</svg>