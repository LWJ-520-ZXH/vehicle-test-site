<script>
document.addEventListener('DOMContentLoaded', function () {
  const data = (window.__SITE_DATA__ && window.__SITE_DATA__.glossary) || []
  const root = document.getElementById('glossary-root')
  const catsEl = document.getElementById('gl-cats')
  const search = document.getElementById('gl-search')
  const countEl = document.getElementById('gl-count')
  if (!root) return
  const esc = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  const cats = []
  data.forEach(t => { if (cats.indexOf(t.cat) < 0) cats.push(t.cat) })
  let activeCat = 'all'
  let query = ''

  function renderCats() {
    let html = '<button class="gl-cat-chip' + (activeCat === 'all' ? ' active' : '') + '" data-cat="all" type="button">全部</button>'
    html += cats.map(c => '<button class="gl-cat-chip' + (activeCat === c ? ' active' : '') + '" data-cat="' + esc(c) + '" type="button">' + esc(c) + '</button>').join('')
    catsEl.innerHTML = html
  }
  function match(t) {
    if (activeCat !== 'all' && t.cat !== activeCat) return false
    if (!query) return true
    const q = query.toLowerCase()
    return (t.term + ' ' + (t.full || '') + ' ' + (t.def || '')).toLowerCase().includes(q)
  }
  function render() {
    const items = data.filter(match)
    countEl.textContent = '共 ' + items.length + ' 条'
    if (!items.length) { root.innerHTML = '<div class="gl-empty">没有匹配的术语，换个关键词或分类试试</div>'; return }
    root.innerHTML = items.map(t => {
      const term = esc(t.term), full = esc(t.full || ''), def = esc(t.def || ''), cat = esc(t.cat || '')
      return '<div class="gl-card" data-term="' + term + '" tabindex="0" role="button" aria-label="复制术语 ' + term + '">'
        + '<span class="gl-cat-tag">' + cat + '</span>'
        + '<div class="gl-term">' + term + (full ? '<span class="gl-full">' + full + '</span>' : '') + '</div>'
        + '<div class="gl-def">' + def + '</div>'
        + '<div class="gl-copy-hint">点击复制术语</div>'
        + '</div>'
    }).join('')
  }
  function done(card) {
    card.classList.add('copied')
    const hint = card.querySelector('.gl-copy-hint')
    if (hint) hint.textContent = '已复制'
    setTimeout(() => { card.classList.remove('copied'); if (hint) hint.textContent = '点击复制术语' }, 1600)
  }
  function fallbackCopy(text, card) {
    try {
      const ta = document.createElement('textarea'); ta.value = text
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta)
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(card)
    } catch (e) {}
  }
  function copy(card) {
    const term = card.getAttribute('data-term') || ''
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(term).then(() => done(card)).catch(() => fallbackCopy(term, card))
    else fallbackCopy(term, card)
  }
  root.addEventListener('click', (e) => { const card = e.target.closest('.gl-card'); if (card) copy(card) })
  root.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { const card = e.target.closest('.gl-card'); if (card) { e.preventDefault(); copy(card) } } })
  catsEl.addEventListener('click', (e) => { const chip = e.target.closest('.gl-cat-chip'); if (!chip) return; activeCat = chip.getAttribute('data-cat'); renderCats(); render() })
  if (search) search.addEventListener('input', () => { query = search.value.trim(); render() })
  renderCats()
  render()
})
</script>
