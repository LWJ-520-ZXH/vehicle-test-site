<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function () {
  const saved = localStorage.getItem('avt-theme') || 'system'
  let t = 'light'
  if (saved === 'dark') t = 'dark'
  else if (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
  document.documentElement.setAttribute('data-theme', t)
  document.documentElement.style.background = t === 'dark' ? '#0a0f1e' : '#f4f7fb'
})()
</script>
<title>题库中心 · 原型 v0.1 · 车载测试学堂</title>
<meta name="description" content="题库中心原型 v0.1：顶部统计条 + 筛选 + 长列表自测，作答即揭示、思路解析、已掌握/再看标记。无分数、无进度、无打卡。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif' font-weight='bold'>VT</text></svg>">
<style>
/* ============================================================
   题库中心原型 v0.1 · 自包含 · 第一版设计
   结构：站点头 + 4 块页头 + 工具条(toggle) + 4 行筛选 + 长列表卡片
   产品红线不变：无分数 / 无正确率 / 无百分比 / 无进度条 / 无打卡
   落地时拆分为 quiz.html + assets/css/quiz.css + assets/js/quiz.js
   ============================================================ */

/* ---------- SITE TOKENS（摘自 main.css，落地时删除） ---------- */
:root {
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --brand: #2563eb; --brand-2: #06b6d4; --accent: #f59e0b;
  --bg: #f4f7fb; --bg-soft: #ffffff; --bg-glass: rgba(255,255,255,.72);
  --card: #ffffff; --card-border: rgba(15,42,80,.08);
  --text: #0e1b2c; --text-2: #4a5a70; --text-3: #8593a8;
  --shadow: 0 4px 20px rgba(24,144,255,.06);
  --shadow-hover: 0 12px 40px rgba(24,144,255,.12);
  --chip: rgba(37,99,235,.08);
  --radius-sm: 12px; --radius-md: 16px; --radius-lg: 20px;
  --surface: #ffffff; --border: #e4ebf3; --hairline: rgba(15,42,80,.1);
  --fs-h1: 28px; --fs-h2: 23px; --fs-h3: 18.5px; --fs-lead: 16.5px;
  --fs-body: 15px; --fs-sm: 13.5px; --fs-xs: 12px;
  --fw-bold: 800; --fw-semi: 700; --fw-med: 600; --fw-reg: 500;
  --lh-tight: 1.25; --lh-base: 1.6;
  --ok: #10b981; --no: #ef4444;
  --ease: cubic-bezier(.16,1,.3,1);
}
html[data-theme="dark"] {
  --bg: #0a0f1e; --bg-soft: #0f1626; --bg-glass: rgba(18,26,46,.72);
  --card: #131b2e; --card-border: rgba(255,255,255,.1);
  --text: #e8effb; --text-2: #9fb2cf; --text-3: #7c8eac;
  --shadow: 0 8px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03);
  --shadow-hover: 0 18px 50px rgba(37,99,235,.3), 0 0 0 1px rgba(96,165,250,.18);
  --chip: rgba(96,165,250,.12);
  --surface: #18223a; --border: rgba(255,255,255,.1); --hairline: rgba(255,255,255,.1);
  --ok: #34d399; --no: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  line-height: var(--lh-base); font-size: var(--fs-body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background .35s ease, color .35s ease;
}
.ui-ic { width:1em; height:1em; flex:none; display:inline-block; vertical-align:-.15em; }

/* ---------- HEADER（摘自 main.css，落地时删除） ---------- */
.site-header {
  position: sticky; top:0; z-index:100;
  backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%);
  background: var(--bg-glass); border-bottom: 1px solid var(--card-border);
}
.header-inner { max-width:1180px; margin:0 auto; padding:0 28px; height:64px; display:flex; align-items:center; gap:28px; }
.logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:.5px; text-decoration:none; color:var(--text); white-space:nowrap; }
.logo-badge { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(135deg,var(--brand),var(--brand-2)); box-shadow:0 6px 16px rgba(37,99,235,.35); }
.logo-badge svg { width:20px; height:20px; }
.nav { display:flex; gap:4px; margin-left:8px; }
.nav a { padding:8px 14px; border-radius:10px; text-decoration:none; color:var(--text-2); font-size:14.5px; font-weight:600; transition:all .25s var(--ease); }
.nav a:hover { background:var(--chip); color:var(--brand); }
.nav a.active { background:var(--chip); color:var(--brand); }
.header-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.hdr-search { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--card-border); border-radius:999px; padding:5px 6px 5px 14px; }
.hdr-search input { border:0; outline:0; background:transparent; color:var(--text); font-size:13.5px; width:170px; font-family:inherit; }
.hdr-search button { border:0; background:transparent; color:var(--text-3); cursor:pointer; display:grid; place-items:center; padding:4px; }
.hdr-search button .ui-ic { width:18px; height:18px; vertical-align:middle; }
.theme-btn { width:36px; height:36px; border-radius:10px; border:1px solid var(--card-border); background:var(--card); color:var(--text-2); cursor:pointer; display:grid; place-items:center; transition:all .25s var(--ease); }
.theme-btn:hover { color:var(--brand); border-color:var(--brand); }
.theme-btn svg { width:18px; height:18px; }
.site-footer { text-align:center; padding:34px 20px 46px; color:var(--text-3); font-size:var(--fs-sm); line-height:1.9; border-top:1px solid var(--card-border); margin-top:40px; }

/* ============================================================
   题库 v0.1：4 块页头 + 工具条 + 筛选 + 长列表
   ============================================================ */
.qz-wrap { max-width:1180px; margin:0 auto; padding:30px 24px 12px; }

/* ---------- 简化页头：仅标题 + 副标题（题量） ---------- */
.qz-head { margin-bottom:16px; }
.qz-h-top { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:0; }
.qz-h-title { display:flex; align-items:center; gap:9px; font-size:var(--fs-h1); font-weight:var(--fw-bold); color:var(--text); letter-spacing:.5px; }
.qz-h-title .ui-ic { color:var(--brand); font-size:26px; }
.qz-h-sub { color:var(--text-2); font-size:var(--fs-lead); }
.qz-h-sub b { color:var(--brand); font-family:var(--font-mono); }

/* ---------- 工具条：搜索 + 3 个 toggle + 结果计数 ---------- */
.qz-toolbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 16px; background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-md); box-shadow:var(--shadow); margin-bottom:16px; }
.qz-search { display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--card-border); border-radius:999px; padding:8px 14px; flex:1; min-width:200px; }
.qz-search .ui-ic { color:var(--text-3); width:16px; height:16px; flex:none; }
.qz-search input { border:0; outline:0; background:transparent; color:var(--text); font-size:var(--fs-sm); width:100%; font-family:inherit; }
.qz-toggles { display:flex; gap:8px; flex-wrap:wrap; }
.qz-toggle { padding:8px 14px; border-radius:999px; cursor:pointer; border:1px solid var(--card-border); background:var(--bg-soft); color:var(--text-2); font-size:var(--fs-sm); font-weight:var(--fw-med); font-family:inherit; transition:all .25s var(--ease); display:inline-flex; align-items:center; gap:7px; }
.qz-toggle:hover { border-color:var(--brand); color:var(--brand); }
.qz-toggle.on { background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 4px 14px rgba(37,99,235,.3); }
.qz-result { font-size:var(--fs-sm); color:var(--text-3); white-space:nowrap; }
.qz-result b { color:var(--brand); font-family:var(--font-mono); font-size:15px; }

/* ---------- 4 行筛选 ---------- */
.qz-filters { padding:16px 16px 4px; background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-md); box-shadow:var(--shadow); margin-bottom:20px; }
.qz-filter-row { display:flex; align-items:flex-start; gap:14px; padding:9px 0; }
.qz-filter-row + .qz-filter-row { border-top:1px dashed var(--hairline); }
.qz-fl { flex:none; width:52px; padding-top:7px; font-size:var(--fs-sm); font-weight:var(--fw-semi); color:var(--text-2); }
.qz-chips { display:flex; flex-wrap:wrap; gap:8px; }

/* 模块卡片式选择器（v0.3 设计，模块轴全量展示 7 模块） */
.qz-mods { display:flex; flex-wrap:wrap; gap:10px; }
.qz-mod {
  --mod-c: var(--brand);
  display:inline-flex; align-items:center; gap:9px; padding:9px 14px; cursor:pointer;
  border:1px solid var(--card-border); background:var(--bg-soft); border-radius:13px;
  font-family:inherit; font-size:var(--fs-sm); font-weight:var(--fw-semi); color:var(--text-2);
  transition:all .25s var(--ease); line-height:1.1;
}
.qz-mod:hover:not(:disabled):not(.on) { border-color:var(--mod-c); color:var(--mod-c); transform:translateY(-2px); }
.qz-mod-badge { width:24px; height:24px; border-radius:7px; flex:none; display:grid; place-items:center; background:color-mix(in srgb, var(--mod-c) 14%, transparent); color:var(--mod-c); font-family:var(--font-mono); font-weight:var(--fw-bold); font-size:13px; }
.qz-mod-name { white-space:nowrap; }
.qz-mod-count { font-family:var(--font-mono); font-size:11px; opacity:.65; background:var(--chip); padding:1px 7px; border-radius:999px; transition:all .25s var(--ease); }
.qz-mod.on { border-color:var(--mod-c); background:color-mix(in srgb, var(--mod-c) 9%, var(--bg-soft)); color:var(--text); box-shadow:0 6px 18px color-mix(in srgb, var(--mod-c) 18%, transparent); }
.qz-mod.on .qz-mod-badge { background:var(--mod-c); color:#fff; }
.qz-mod.on .qz-mod-count { background:color-mix(in srgb, var(--mod-c) 16%, transparent); color:var(--mod-c); opacity:1; }
.qz-mod:disabled { opacity:.38; cursor:not-allowed; }

.chip { padding:7px 15px; border-radius:999px; cursor:pointer; border:1px solid var(--card-border); background:var(--bg-soft); color:var(--text-2); font-size:var(--fs-sm); font-weight:var(--fw-med); font-family:inherit; transition:all .25s var(--ease); display:inline-flex; align-items:center; gap:7px; }
.chip .c-dot { width:8px; height:8px; border-radius:50%; background:var(--mod-c, var(--text-3)); }
.chip .c-count { font-family:var(--font-mono); font-size:11px; opacity:.7; }
.chip:hover:not(:disabled):not(.active) { transform:translateY(-2px); border-color:var(--brand); color:var(--brand); }
.chip.active { background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; box-shadow:0 4px 16px rgba(37,99,235,.3); cursor:default; }
.chip.active .c-dot { background:#fff; }
.chip:disabled { opacity:.38; cursor:not-allowed; }
.chip-mod.active { background:var(--mod-c); box-shadow:0 4px 16px color-mix(in srgb, var(--mod-c) 40%, transparent); }

/* ---------- 长列表 + 题卡 ---------- */
.qz-list { display:flex; flex-direction:column; gap:18px; }
.qz-card { position:relative; overflow:hidden; padding:22px 24px 20px; background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-lg); box-shadow:var(--shadow); transition:box-shadow .35s ease, border-color .35s ease; }
.qz-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--mod-c, var(--brand)); }
.qz-card:hover { box-shadow:var(--shadow-hover); }
.qz-card-badges { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
.qz-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:6px; font-size:var(--fs-xs); font-weight:var(--fw-semi); letter-spacing:.2px; }
.qz-badge-mod { background:color-mix(in srgb, var(--mod-c) 13%, transparent); color:var(--mod-c); }
.qz-badge-type { background:color-mix(in srgb, var(--brand) 11%, transparent); color:var(--brand); }
.qz-badge-diff { background:color-mix(in srgb, var(--df-c) 13%, transparent); color:var(--df-c); }
.qz-badge-cat { background:var(--chip); color:var(--text-2); }
.qz-badge-dir { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
.qz-badge-num { background:var(--border); color:var(--text-3); font-family:var(--font-mono); }

.qz-stem { font-size:17.5px; font-weight:var(--fw-semi); line-height:1.7; color:var(--text); margin-bottom:16px; letter-spacing:.2px; }
.qz-stem .qz-multi-hint { font-weight:var(--fw-reg); font-size:var(--fs-sm); color:var(--text-3); margin-left:8px; }

.qz-options { display:flex; flex-direction:column; gap:10px; }
.qz-opt {
  display:flex; align-items:flex-start; gap:12px; padding:12px 15px; width:100%; text-align:left;
  border:1px solid var(--card-border); background:var(--bg-soft); border-radius:12px;
  color:var(--text); font-size:var(--fs-body); font-family:inherit; line-height:1.55; cursor:pointer;
  transition:border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease);
}
.qz-opt:hover:not(:disabled) { border-color:var(--brand); background:color-mix(in srgb, var(--brand) 5%, var(--bg-soft)); transform:translateX(2px); }
.qz-opt-key { flex:none; width:26px; height:26px; border-radius:7px; display:grid; place-items:center; background:var(--chip); color:var(--text-2); font-size:13px; font-weight:var(--fw-bold); font-family:var(--font-mono); margin-top:1px; transition:all .25s var(--ease); }
.qz-opt-text { flex:1; }
.qz-opt-ic { flex:none; width:18px; margin-top:4px; opacity:0; transition:opacity .25s var(--ease); }
.qz-opt.picked { border-color:var(--brand); background:color-mix(in srgb, var(--brand) 8%, var(--bg-soft)); }
.qz-opt.picked .qz-opt-key { background:var(--brand); color:#fff; }
.qz-opt.correct { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--bg-soft)); }
.qz-opt.correct .qz-opt-key { background:var(--ok); color:#fff; }
.qz-opt.correct .qz-opt-ic { opacity:1; color:var(--ok); }
.qz-opt.wrong { border-color:var(--no); background:color-mix(in srgb, var(--no) 9%, var(--bg-soft)); }
.qz-opt.wrong .qz-opt-key { background:var(--no); color:#fff; }
.qz-opt.wrong .qz-opt-ic { opacity:1; color:var(--no); }
.qz-opt:disabled { cursor:default; }
.qz-opt.dim { opacity:.58; }

/* 键盘焦点环 */
.chip:focus-visible, .qz-toggle:focus-visible, .qz-opt:focus-visible,
.qz-btn:focus-visible, .qz-more:focus-visible, .qz-src:focus-visible, .qz-mod:focus-visible {
  outline:2px solid var(--brand); outline-offset:2px;
}

/* 动作条 */
.qz-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; padding-top:16px; border-top:1px dashed var(--hairline); }
.qz-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; border:1px solid var(--card-border); background:var(--bg-soft); color:var(--text-2); font-size:var(--fs-sm); font-weight:var(--fw-med); cursor:pointer; font-family:inherit; transition:all .25s var(--ease); }
.qz-btn:hover { border-color:var(--brand); color:var(--brand); }
.qz-btn-primary { background:var(--brand); border-color:var(--brand); color:#fff; }
.qz-btn-primary:hover { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
.qz-btn-primary:disabled { opacity:.45; cursor:not-allowed; background:var(--brand); border-color:var(--brand); }
.qz-btn-known.on { background:color-mix(in srgb, var(--ok) 13%, transparent); border-color:var(--ok); color:var(--ok); }
.qz-btn-review.on { background:color-mix(in srgb, var(--accent) 14%, transparent); border-color:var(--accent); color:var(--accent); }
.qz-src { margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--text-3); text-decoration:none; transition:color .25s var(--ease); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qz-src:hover { color:var(--brand); }
.qz-src .ui-ic { width:15px; height:15px; }

/* 揭示区（v0.1：4 盒） */
.qz-reveal { margin-top:16px; display:block; animation:qzIn .35s var(--ease); }
@keyframes qzIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
.qz-toggle-expl { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:9px; border:1px solid var(--card-border); background:var(--bg-soft); color:var(--text-2); font-size:var(--fs-sm); font-weight:var(--fw-med); cursor:pointer; font-family:inherit; transition:all .25s var(--ease); margin-bottom:12px; }
.qz-toggle-expl:hover { border-color:var(--brand); color:var(--brand); }
.qz-toggle-expl .ui-ic { width:15px; height:15px; transition:transform .25s var(--ease); }
.qz-toggle-expl.on .ui-ic { transform:rotate(180deg); }
.qz-answer { display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:10px; background:color-mix(in srgb, var(--ok) 13%, transparent); color:var(--ok); font-size:var(--fs-body); font-weight:var(--fw-semi); margin-bottom:12px; }
.qz-answer .ui-ic { width:17px; height:17px; }
.qz-expl { padding:14px 16px; border-radius:12px; background:color-mix(in srgb, var(--mod-c) 5%, var(--bg-soft)); border:1px solid var(--card-border); margin-bottom:12px; }
.qz-expl-body { font-size:var(--fs-body); color:var(--text-2); line-height:1.78; }
.qz-refans { font-size:var(--fs-body); color:var(--text); line-height:1.8; padding-bottom:11px; margin-bottom:11px; border-bottom:1px dashed var(--hairline); }
.qz-keypoints { margin-top:12px; padding-top:11px; border-top:1px dashed var(--hairline); }
.qz-keypoints-h { font-size:var(--fs-xs); font-weight:var(--fw-semi); color:var(--text-3); letter-spacing:.6px; margin-bottom:7px; }
.qz-keypoints ul { list-style:none; display:flex; flex-direction:column; gap:6px; }
.qz-keypoints li { position:relative; padding-left:17px; font-size:var(--fs-sm); color:var(--text-2); line-height:1.65; }
.qz-keypoints li::before { content:""; position:absolute; left:3px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--mod-c); }
.qz-source { font-size:var(--fs-xs); color:var(--text-3); padding:9px 13px; border-radius:9px; background:var(--border); display:flex; align-items:center; gap:7px; }
.qz-source .ui-ic { width:14px; height:14px; opacity:.7; }

/* 加载更多 / 空态 */
.qz-more { align-self:center; margin-top:6px; padding:11px 30px; border-radius:999px; border:1px solid var(--card-border); background:var(--card); color:var(--brand); font-size:var(--fs-sm); font-weight:var(--fw-semi); cursor:pointer; font-family:inherit; transition:all .25s var(--ease); }
.qz-more:hover { border-color:var(--brand); box-shadow:var(--shadow-hover); }
.qz-empty { text-align:center; padding:60px 24px; color:var(--text-3); background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-lg); }
.qz-empty .ui-ic { width:40px; height:40px; opacity:.5; margin-bottom:12px; }
.qz-empty-t { font-size:var(--fs-lead); font-weight:var(--fw-semi); color:var(--text-2); margin-bottom:6px; }

/* 原型说明（落地时删除） */
.proto-note { max-width:1180px; margin:34px auto 0; padding:20px 24px; border-radius:var(--radius-md); background:color-mix(in srgb, var(--accent) 7%, var(--card)); border:1px dashed color-mix(in srgb, var(--accent) 45%, transparent); }
.proto-note h3 { display:flex; align-items:center; gap:8px; font-size:var(--fs-h3); margin-bottom:10px; color:var(--text); }
.proto-note h3 .ui-ic { color:var(--accent); }
.proto-note ul { list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:7px 22px; }
.proto-note li { position:relative; padding-left:16px; font-size:var(--fs-sm); color:var(--text-2); line-height:1.7; }
.proto-note li::before { content:""; position:absolute; left:2px; top:.66em; width:5px; height:5px; border-radius:50%; background:var(--accent); }
.proto-note li b { color:var(--text); }

@media (max-width: 960px) {
  .header-inner { padding:0 16px; gap:14px; }

/* ============================================================
   QuizMark —— localStorage 轻标记（与 LastViewed 同族）
   只存用户主动标注的 known / review，不存对错、不存分数
   ============================================================ */
const QuizMark = {
  KEY: 'avt-quizmark',
  _d: null,
  all() {
    if (this._d) return this._d
    try { this._d = JSON.parse(localStorage.getItem(this.KEY) || '{}') } catch (e) { this._d = {} }
    return this._d
  },
  get(id) { return this.all()[id] || '' },
  set(id, v) {
    const d = this.all()
    if (!v || d[id] === v) delete d[id]; else d[id] = v
    try { localStorage.setItem(this.KEY, JSON.stringify(d)) } catch (e) {}
    return d[id] || ''
  },
  count(v) { const d = this.all(); return Object.keys(d).filter(k => d[k] === v).length }
}

/* ============================================================
   QuizPage v0.1 —— 长列表自测
   ============================================================ */
const QuizPage = (function () {
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  const PAGE = 6
  const state = { mod: 'all', type: 'all', diff: 'all', ch: 'all', q: '', shown: PAGE, shuffle: false, hideKnown: false, reviewOnly: false }
  const sess = {}                 // 本次会话作答态（不落地）：{ picked:[], revealed, explOpen }
  let SHUFFLE_ORDER = null        // 打乱顺序一次性生成，保持稳定
  let filtersEl, listEl, resultEl

  function countBy(fn) { return QUESTIONS.filter(fn).length }

  /* ---------- 筛选 chip ---------- */
  function chip(dim, val, label, c, color) {
    const on = state[dim] === val
    return '<button type="button" class="chip' + (color ? ' chip-mod' : '') + (on ? ' active' : '') + '"' +
      (color ? ' style="--mod-c:' + color + '"' : '') +
      ' data-dim="' + dim + '" data-val="' + esc(val) + '"' + (c === 0 ? ' disabled' : '') + '>' +
      (color ? '<span class="c-dot"></span>' : '') + esc(label) +
      (c == null ? '' : '<span class="c-count">' + c + '</span>') + '</button>'
  }
  function modCard(val, label, c, color, badge) {
    const on = state.mod === val
    return '<button type="button" class="qz-mod' + (on ? ' on' : '') + '"' +
      ' data-mod="' + esc(val) + '"' + (c === 0 && val !== 'all' ? ' disabled' : '') +
      (color ? ' style="--mod-c:' + color + '"' : '') + '>' +
      (badge ? '<span class="qz-mod-badge">' + badge + '</span>' : '') +
      '<span class="qz-mod-name">' + esc(label) + '</span>' +
      '<span class="qz-mod-count">' + c + '</span></button>'
  }
  function renderFilters() {
    let h = ''
    // 模块：全站 7 模块（A-R）卡片式选择器，无题量模块 disabled；试点外模块先占位，扩量时不用改 UI
    h += '<div class="qz-filter-row"><div class="qz-fl">模块</div><div class="qz-mods">'
    h += modCard('all', '全部模块', QUESTIONS.length, null, null)
    Object.keys(MODULE_NAMES).forEach(m => {
      h += modCard(m, MODULE_NAMES[m], countBy(q => q.module === m), MODULE_COLORS[m], m)
    })
    h += '</div></div>'
    h += '<div class="qz-filter-row"><div class="qz-fl">题型</div><div class="qz-chips">'
    h += chip('type', 'all', '全部', QUESTIONS.length)
    QUIZ_META.types.forEach(t => { h += chip('type', t, TYPE_NAMES[t], countBy(q => q.type === t)) })
    h += '</div></div>'
    h += '<div class="qz-filter-row"><div class="qz-fl">难度</div><div class="qz-chips">'
    h += chip('diff', 'all', '全部', QUESTIONS.length)
    QUIZ_META.difficulties.forEach(d => { h += chip('diff', d, d, countBy(q => q.difficulty === d), DIFF_COLORS[d]) })
    h += '</div></div>'
    // 章节：平铺全部 18，不分组、不级联
    h += '<div class="qz-filter-row"><div class="qz-fl">章节</div><div class="qz-chips">'
    h += chip('ch', 'all', '全部章节', QUESTIONS.length)
    QUIZ_META.pilotChapters.forEach(c => {
      h += chip('ch', String(c.num), c.num + ' ' + c.title, countBy(q => q.chapterNum === c.num), MODULE_COLORS[c.module])
    })
    h += '</div></div>'
    filtersEl.innerHTML = h
  }

  /* ---------- 匹配（筛选 + 搜索 + toggle） ---------- */
  function matchBase(q) {
    if (state.mod !== 'all' && q.module !== state.mod) return false
    if (state.type !== 'all' && q.type !== state.type) return false
    if (state.diff !== 'all' && q.difficulty !== state.diff) return false
    if (state.ch !== 'all' && String(q.chapterNum) !== state.ch) return false
    if (state.q) {
      const s = (q.stem + ' ' + (q.tags || []).join(' ') + ' ' + q.sectionTitle + ' ' + q.id).toLowerCase()
      if (!s.includes(state.q.toLowerCase())) return false
    }
    return true
  }
  function baseList() {
    let list = QUESTIONS.filter(q => matchBase(q))
    if (state.hideKnown) list = list.filter(q => QuizMark.get(q.id) !== 'known')
    if (state.reviewOnly) list = list.filter(q => QuizMark.get(q.id) === 'review')
    if (state.shuffle) {
      if (!SHUFFLE_ORDER) SHUFFLE_ORDER = QUESTIONS.map(q => q.id).sort(() => Math.random() - 0.5)
      const pos = {}; SHUFFLE_ORDER.forEach((id, i) => { pos[id] = i })
      list = list.slice().sort((a, b) => pos[a.id] - pos[b.id])
    }
    return list
  }

  /* ---------- 题卡 ---------- */
  function optionsHTML(q, st) {
    if (q.type === 'short') return ''
    const opts = q.type === 'judge'
      ? [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }]
      : (q.options || [])
    const revealed = st && st.revealed
    const picked = st ? st.picked : []
    return '<div class="qz-options">' + opts.map(o => {
      let cls = 'qz-opt', ic = ''
      if (revealed) {
        const isAns = q.answer.indexOf(o.key) >= 0, isPk = picked.indexOf(o.key) >= 0
        if (isAns) { cls += ' correct'; ic = ICON('check') }
        else if (isPk) { cls += ' wrong'; ic = ICON('cross') }
        else cls += ' dim'
      } else if (picked.indexOf(o.key) >= 0) cls += ' picked'
      return '<button type="button" class="' + cls + '" data-key="' + o.key + '"' + (revealed ? ' disabled' : '') + '>' +
        '<span class="qz-opt-key">' + o.key + '</span>' +
        '<span class="qz-opt-text">' + esc(o.text) + '</span>' +
        '<span class="qz-opt-ic">' + ic + '</span></button>'
    }).join('') + '</div>'
  }
  // v0.1 揭示区：4 盒（思路解析折叠 + 绿色答案框 + 解析框 + 素材来源死文本）
  function revealHTML(q, st) {
    const isShort = q.type === 'short'
    const ansLabel = isShort ? '参考答案'
      : '正确答案 ' + (q.type === 'judge' ? (q.answer[0] === 'T' ? '正确' : '错误') : q.answer.join(' · '))
    const open = st && st.explOpen
    let body = ''
    if (isShort) {
      body += '<div class="qz-refans">' + esc(q.refAnswer) + '</div>'
    }
    body += '<div class="qz-expl-body">' + esc(q.explanation) + '</div>'
    if (q.keyPoints && q.keyPoints.length) {
      body += '<div class="qz-keypoints"><div class="qz-keypoints-h">答题要点</div><ul>' +
        q.keyPoints.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul></div>'
    }
    const srcLabel = q.sourceRef ? q.sourceRef.label : q.sectionTitle
    return '<div class="qz-reveal">' +
      '<button type="button" class="qz-toggle-expl' + (open ? ' on' : '') + '" aria-expanded="' + (open ? 'true' : 'false') + '">思路解析 ' + ICON('chevronDown') + '</button>' +
      '<div class="qz-answer">' + ICON('check') + esc(ansLabel) + '</div>' +
      '<div class="qz-expl"' + (open ? '' : ' hidden') + '>' + body + '</div>' +
      '<div class="qz-source">' + ICON('link') + '素材来源：' + esc(srcLabel) + '</div>' +
    '</div>'
  }
  function cardHTML(q) {
    const mc = MODULE_COLORS[q.module], dc = DIFF_COLORS[q.difficulty] || mc
    const mk = QuizMark.get(q.id)
    const badges = [
      '<span class="qz-badge qz-badge-mod" style="--mod-c:' + mc + '">' + q.module + ' · 第' + q.chapterNum + '章</span>',
      '<span class="qz-badge qz-badge-type">' + TYPE_NAMES[q.type] + '</span>',
      '<span class="qz-badge qz-badge-diff" style="--df-c:' + dc + '">' + esc(q.difficulty) + '</span>',
      '<span class="qz-badge qz-badge-cat">' + esc(q.cat) + '</span>'
    ]
    if (q.direction === '反向') badges.push('<span class="qz-badge qz-badge-dir">反向题</span>')
    badges.push('<span class="qz-badge qz-badge-num">' + esc(q.id) + '</span>')
    const submit = q.type === 'multiple'
      ? '<button type="button" class="qz-btn qz-btn-primary qz-submit" disabled>' + ICON('check') + '提交作答</button>'
      : (q.type === 'short' ? '<button type="button" class="qz-btn qz-btn-primary qz-submit">' + ICON('link') + '查看参考答案</button>' : '')
    const st = sess[q.id]
    return '<article class="qz-card" data-id="' + q.id + '" style="--mod-c:' + mc + ';--df-c:' + dc + '">' +
      '<div class="qz-card-badges">' + badges.join('') + '</div>' +
      '<div class="qz-stem">' + esc(q.stem) + (q.type === 'multiple' ? '<span class="qz-multi-hint">可多选</span>' : '') + '</div>' +
      optionsHTML(q, st) +
      '<div class="qz-actions">' +
        submit +
        '<button type="button" class="qz-btn qz-btn-known qz-mark' + (mk === 'known' ? ' on' : '') + '" data-mark="known">' + ICON('check') + '已掌握</button>' +
        '<button type="button" class="qz-btn qz-btn-review qz-mark' + (mk === 'review' ? ' on' : '') + '" data-mark="review">' + ICON('bookmark') + '再看</button>' +
        '<a class="qz-src" href="chapter.html?id=' + q.chapterNum + '&kp=' + q.sectionIndex + '" title="回到第' + q.chapterNum + '章原文知识点：' + esc(q.sectionTitle) + '">' + ICON('link') + esc(q.sectionTitle) + '</a>' +
      '</div>' +
      (st && st.revealed ? revealHTML(q, st) : '') +
    '</article>'
  }
  function emptyHTML() {
    return '<div class="qz-empty">' + ICON('search') +
      '<div class="qz-empty-t">这个条件下暂时没有题目</div>' +
      '<div>放宽筛选，或点击工具条的「只看再看」试试。</div></div>'
  }

  /* ---------- 渲染主列表 ---------- */
  function render() {
    const list = baseList()
    resultEl.innerHTML = '匹配 <b>' + list.length + '</b> 题'
    if (!list.length) { listEl.innerHTML = emptyHTML(); return }
    const show = list.slice(0, state.shown)
    let h = show.map(cardHTML).join('')
    if (list.length > state.shown) h += '<button type="button" class="qz-more" id="qz-more">加载更多（剩 ' + (list.length - state.shown) + ' 题）</button>'
    listEl.innerHTML = h
  }

  /* ---------- 作答即揭示（原地更新） ---------- */
  function doReveal(cardEl, q) {
    const st = sess[q.id] || (sess[q.id] = { picked: [], revealed: false, explOpen: false })
    if (q.type !== 'short') {
      const picked = q.type === 'multiple'
        ? Array.from(cardEl.querySelectorAll('.qz-opt.picked')).map(b => b.getAttribute('data-key'))
        : [cardEl.querySelector('.qz-opt.picked').getAttribute('data-key')]
      cardEl.querySelectorAll('.qz-opt').forEach(b => {
        b.disabled = true
        const k = b.getAttribute('data-key')
        const isAns = q.answer.indexOf(k) >= 0, isPk = picked.indexOf(k) >= 0
        b.classList.remove('picked')
        if (isAns) { b.classList.add('correct'); b.querySelector('.qz-opt-ic').innerHTML = ICON('check') }
        else if (isPk) { b.classList.add('wrong'); b.querySelector('.qz-opt-ic').innerHTML = ICON('cross') }
        else b.classList.add('dim')
      })
      st.picked = picked
    }
    st.revealed = true
    const wrap = document.createElement('div'); wrap.innerHTML = revealHTML(q, st)
    cardEl.appendChild(wrap.firstChild)
    const sub = cardEl.querySelector('.qz-submit'); if (sub) sub.hidden = true
  }

  /* ---------- 事件 ---------- */
  function bind() {
    // 筛选 chip + 模块卡片
    filtersEl.addEventListener('click', e => {
      const modBtn = e.target.closest('.qz-mod')
      if (modBtn && !modBtn.disabled) {
        state.mod = modBtn.getAttribute('data-mod')
        state.shown = PAGE; renderFilters(); render(); return
      }
      const c = e.target.closest('.chip'); if (!c || c.disabled) return
      const dim = c.getAttribute('data-dim'), val = c.getAttribute('data-val')
      state[dim] = val; state.shown = PAGE; renderFilters(); render()
    })
    // 工具条 toggle
    document.querySelectorAll('.qz-toggle').forEach(b => {
      b.addEventListener('click', () => {
        const tg = b.getAttribute('data-tg')
        state[tg] = !state[tg]
        b.classList.toggle('on', state[tg])
        if (tg === 'shuffle' && !state[tg]) SHUFFLE_ORDER = null   // 关闭打乱 → 恢复原始顺序
        state.shown = PAGE; render()
      })
    })
    // 搜索
    document.getElementById('qz-q').addEventListener('input', e => { state.q = e.target.value.trim(); state.shown = PAGE; render() })
    // 列表交互（选项/提交/思路解析折叠/标记/加载更多）
    listEl.addEventListener('click', e => {
      if (e.target.closest('#qz-more')) { state.shown += PAGE; render(); return }
      const card = e.target.closest('.qz-card'); if (!card) return
      const q = QUESTIONS.find(x => x.id === card.getAttribute('data-id')); if (!q) return

      const tog = e.target.closest('.qz-toggle-expl')
      if (tog) {
        const st = sess[q.id] || (sess[q.id] = { picked: [], revealed: false, explOpen: false })
        st.explOpen = !st.explOpen
        const ex = card.querySelector('.qz-expl'); if (ex) ex.hidden = !st.explOpen
        tog.classList.toggle('on', st.explOpen)
        tog.setAttribute('aria-expanded', st.explOpen ? 'true' : 'false')
        return
      }
      const opt = e.target.closest('.qz-opt')
      if (opt && !opt.disabled) {
        if (q.type === 'multiple') {
          opt.classList.toggle('picked')
          card.querySelector('.qz-submit').disabled = card.querySelectorAll('.qz-opt.picked').length === 0
        } else {
          card.querySelectorAll('.qz-opt').forEach(b => b.classList.remove('picked'))
          opt.classList.add('picked'); doReveal(card, q)
        }
        return
      }
      if (e.target.closest('.qz-submit')) { doReveal(card, q); return }
      const mk = e.target.closest('.qz-mark')
      if (mk) { QuizMark.set(q.id, mk.getAttribute('data-mark')); render(); return }
    })
    // 主题
    document.getElementById('theme-btn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme')
      const next = cur === 'dark' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', next)
      localStorage.setItem('avt-theme', next)
    })
  }

  /* ---------- 原型说明 ---------- */
  function renderProtoNote() {
    document.getElementById('proto-h').innerHTML = ICON('alert') + ' 原型说明 · v0.1 第一版设计'
    document.getElementById('proto-list').innerHTML = [
      '<b>第一版结构</b>：站点头 + 简化页头(标题+副标题) + 工具条(toggle) + 4 行筛选 + 长列表卡片',
      '<b>工具条 3 toggle</b>：打乱顺序 / 隐藏已掌握 / 只看再看 + 题干搜索 + 匹配计数',
      '<b>模块选择器</b>：全站 7 模块（A 网络与协议 / B 工具链 / C 流程与方法 / D 域测试专项 / E 座舱功能测试 / F 标准与进阶 / R 学习路径）卡片式展示；试点暂未覆盖的模块 disabled（0 题量），将来扩量不用改 UI',
      '<b>筛选 4 行</b>：模块（7 模块卡片） / 题型 / 难度 / 章节（章节 18 个平铺，不分组不级联）',
      '<b>题卡 6 徽标</b>：模块+章 / 题型 / 难度 / 分类 / 反向题(仅反向) / 题号',
      '<b>揭示 4 盒</b>：思路解析折叠 + 绿色答案框 + 解析框(含要点) + 素材来源死文本',
      '<b>核心交互</b>：单选/判断点选即揭示；多选提交后揭示；简答点「查看参考答案」揭示',
      '<b>核心交互</b>：正确绿+对勾、误选红+叉、未选淡出、全部锁定',
      '<b>核心交互</b>：已掌握/再看 互斥书签，写 localStorage 刷新留存；隐藏已掌握/只看再看即时生效',
      '<b>图标</b>：quiz / cross / bookmark / chevronDown（v0.1 落地需并入 app.js 的新图标）',
      '<b>列表批处理</b>：首次显示 6 题，底部「加载更多」每次 +6',
      '<b>示例数据</b>：12 题取自第 2 / 8 / 24 章真实内容，正式版目标约 280 题、覆盖 159 个知识点',
      '<b>产品红线</b>：全页无分数 / 无正确率 / 无百分比 / 无进度条 / 无打卡，localStorage 只存 known 与 review',
      '<b>待落地</b>：拆 quiz.html + quiz.css + quiz.js；数据走 data/quiz/NN.json + 独立 quiz-bundle.js',
      '<b>响应式</b>：≤960px 筛选标签换行、章节 chip 整行、题卡满宽',
      '<b>说明</b>：本版为初版设计还原基础上再精简页头：去掉统计条(题目/章节/知识点/题型)和「无分数」声明框——前者是建设进度对用户无价值，后者是产品向用户解释自己没做什么，多余。核心交互与样式保持第一版结构不变。'
    ].map(s => '<li>' + s + '</li>').join('')
  }

  return {
    init() {
      filtersEl = document.getElementById('qz-filters')
      listEl = document.getElementById('qz-list')
      resultEl = document.getElementById('qz-result')
      renderFilters(); renderProtoNote(); bind(); render()
    }
  }
})()
window.QuizPage = QuizPage
document.addEventListener('DOMContentLoaded', () => QuizPage.init())
</script>
