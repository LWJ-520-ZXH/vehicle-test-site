<script>
(function () {
  const saved = localStorage.getItem('avt-theme') || 'system'
  let t = 'light'
  if (saved === 'dark') t = 'dark'
  else if (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
  document.documentElement.setAttribute('data-theme', t)
  document.documentElement.style.background = t === 'dark' ? '#0a0f1e' : '#f4f7fb'
})()
</script>

<script>
(function(){
  var V='20260813225913';
  function check(){
    fetch('assets/version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.version&&j.version!==V){location.reload(true);} })
      .catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){ setTimeout(check,800); }
  });
})();

<div class="qz-wrap">

    </div>
  </section>

      <button type="button" class="qz-toggle" data-tg="reviewOnly">只看再看</button>

    <div class="qz-result" id="qz-result">匹配 <b>0</b> 题</div>
  </div>

  <!-- 4 行筛选（平铺，章节不分组） -->
